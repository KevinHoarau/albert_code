# kilocode_change - new file
# albert_change - reduced to what Albert Code ships: security fixes of the bun
# workspace and version updates of the GitHub Actions used by albert.yml.
# kilo-docs (npm) and kilo-jetbrains (gradle) are not shipped and are not
# scanned. Version updates target albert_code (main only receives
# fast-forwards). Security updates always target the default branch (main):
# never merge them there, apply the fix on albert_code instead (UPSTREAM.md).
version: 2
updates:
  # Bun workspace root: security updates only (a limit of 0 turns version
  # updates off, not security updates). Ordinary version bumps come with
  # upstream merges; proposing them here would conflict with bun.lock at each
  # Kilo update. The CI (host scan of the VSIX, network E2E) checks every fix.
  - package-ecosystem: "bun"
    directory: "/"
    target-branch: "albert_code"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    # One PR for all security fixes, instead of one per alert.
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # Actions used by .github/workflows/albert.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "albert_code"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
