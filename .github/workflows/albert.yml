name: albert

# Albert Code CI: checks of the packages Albert Code modifies, the network
# isolated end-to-end test and its negative, the VSIX build (every target Kilo
# Code ships, all cross-built from Linux) with its host scan, and an end-to-end
# test with its negative of each other target on a runner of that platform.
# The VSIX are kept as workflow artifacts. A vX.Y.Z tag on main also creates
# the GitHub Release with those VSIX; the same files are then uploaded to the
# VS Code Marketplace by hand (see RELEASE.md).

on:
  push:
    branches: [albert_code, main]
    tags: ["v*"]
  pull_request:
    branches: [albert_code, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.4
  ZIG_URL: https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz
  ZIG_SHA256: 473ec26806133cf4d1918caf1a410f8403a13d979726a9045b421b685031a982

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Workflow allowlist
        run: bun run script/check-workflows.ts
      - name: Typecheck
        run: |
          for dir in albert opencode core kilo-telemetry kilo-gateway kilo-vscode; do
            (cd packages/$dir && bun run typecheck)
          done
      - name: Lint (extension)
        run: bun run --cwd packages/kilo-vscode lint
      - name: Bubblewrap for the core sandbox tests
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: ripgrep on PATH (core tests otherwise download it at test time)
        env:
          GH_TOKEN: ${{ github.token }}
          RG: ripgrep-15.1.0-x86_64-unknown-linux-musl
          RG_SHA256: 1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
        run: |
          # gh goes through the API, which kept serving assets while release
          # downloads answered 504.
          gh release download 15.1.0 -R BurntSushi/ripgrep -p "$RG.tar.gz" -D "$RUNNER_TEMP"
          echo "$RG_SHA256  $RUNNER_TEMP/$RG.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$RG.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$RG" >> "$GITHUB_PATH"
      - name: Unit tests (guard, core, telemetry)
        run: |
          (cd packages/albert && bun test)
          (cd packages/core && bun test)
          (cd packages/kilo-telemetry && bun test)
      - name: Unit tests (CLI, Albert mode and touched areas)
        working-directory: packages/opencode
        run: bun test test/albert test/config test/tool/registry.test.ts test/plugin test/provider test/session
      - name: Unit tests (extension)
        run: bun run --cwd packages/kilo-vscode test:unit

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Native packages of every platform, for the cross-built CLIs.
      - run: bun install --frozen-lockfile --os='*' --cpu='*'
      - name: Tools for the isolated network namespace
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables tcpdump
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Zig (build of the bundled Bubblewrap helper)
        run: |
          curl -fsSL "$ZIG_URL" -o "$RUNNER_TEMP/zig.tar.xz"
          echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "ZIG=$RUNNER_TEMP/zig-linux-x86_64-0.14.0/zig" >> "$GITHUB_ENV"
      - name: Build the CLI
        working-directory: packages/opencode
        run: bun run script/build.ts --single --skip-install
      - name: Network E2E test
        run: bash packages/albert/e2e/run.sh packages/opencode/dist/@kilocode/cli-linux-x64/bin/kilo
      - name: Negative test (a deliberate leak must be detected)
        run: bash packages/albert/e2e/negative.sh packages/opencode/dist/@kilocode/cli-linux-x64/bin/kilo
      - name: Build the other CLIs (cross-built), the VSIX of every target, and scan them for hosts
        working-directory: packages/kilo-vscode
        run: bun script/albert-package.ts
      - name: VS Code smoke test (extension host in the isolated namespace)
        run: |
          curl -fsSL "https://update.code.visualstudio.com/latest/linux-deb-x64/stable" -o "$RUNNER_TEMP/code.deb"
          sudo apt-get install -y "$RUNNER_TEMP/code.deb" xvfb x11-utils x11-apps
          xvfb-run -a bash packages/albert/e2e/run.sh --vscode packages/kilo-vscode/out/albert-code-linux-x64.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: albert-code-linux-x64-vsix
          path: packages/kilo-vscode/out/albert-code-linux-x64.vsix
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: albert-code-linux-arm64-vsix
          path: packages/kilo-vscode/out/albert-code-linux-arm64.vsix
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: albert-code-alpine-x64-vsix
          path: packages/kilo-vscode/out/albert-code-alpine-x64.vsix
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: albert-code-alpine-arm64-vsix
          path: packages/kilo-vscode/out/albert-code-alpine-arm64.vsix
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: albert-code-darwin-x64-vsix
          path: packages/kilo-vscode/out/albert-code-darwin-x64.vsix
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: albert-code-darwin-arm64-vsix
          path: packages/kilo-vscode/out/albert-code-darwin-arm64.vsix
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: albert-code-win32-x64-vsix
          path: packages/kilo-vscode/out/albert-code-win32-x64.vsix
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: albert-code-win32-arm64-vsix
          path: packages/kilo-vscode/out/albert-code-win32-arm64.vsix
          retention-days: 14

  # The other targets, each on a runner of its platform, from the VSIX built
  # above: run.sh on Linux arm64, run.sh inside an Alpine container
  # (alpine.sh), pf rules for a dedicated user on macOS (macos.sh), the Windows
  # Filtering Platform audit on Windows (windows.ps1). Each has its negative test.
  native:
    name: e2e (${{ matrix.target }})
    needs: e2e
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-arm64, runner: ubuntu-24.04-arm, kind: linux }
          - { target: alpine-x64, runner: ubuntu-24.04, kind: alpine }
          - { target: alpine-arm64, runner: ubuntu-24.04-arm, kind: alpine }
          - { target: darwin-x64, runner: macos-15-intel, kind: macos }
          - { target: darwin-arm64, runner: macos-15, kind: macos }
          - { target: win32-x64, runner: windows-2025, kind: windows }
          - { target: win32-arm64, runner: windows-11-arm, kind: windows }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Unit tests (guard)
        working-directory: packages/albert
        run: bun test --timeout 30000
      - uses: actions/download-artifact@v4
        with:
          name: albert-code-${{ matrix.target }}-vsix
          path: ${{ runner.temp }}/vsix
      - name: Extract the VSIX
        if: matrix.kind != 'windows'
        run: unzip -q "$RUNNER_TEMP/vsix/albert-code-${{ matrix.target }}.vsix" -d "$RUNNER_TEMP/ext"
      - name: Extract the VSIX (Windows)
        if: matrix.kind == 'windows'
        run: |
          New-Item -ItemType Directory "$env:RUNNER_TEMP\ext" | Out-Null
          tar -xf "$env:RUNNER_TEMP\vsix\albert-code-${{ matrix.target }}.vsix" -C "$env:RUNNER_TEMP\ext"
      - name: Tools for the isolated network namespace
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables tcpdump
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Network E2E test and its negative (namespace)
        if: matrix.kind == 'linux'
        run: |
          bash packages/albert/e2e/run.sh "$RUNNER_TEMP/ext/extension/bin/kilo"
          bash packages/albert/e2e/negative.sh "$RUNNER_TEMP/ext/extension/bin/kilo"
      - name: Network E2E test and its negative (namespace inside an Alpine container)
        if: matrix.kind == 'alpine'
        run: |
          bash packages/albert/e2e/alpine.sh "$RUNNER_TEMP/ext/extension/bin/kilo"
          bash packages/albert/e2e/alpine.sh --negative "$RUNNER_TEMP/ext/extension/bin/kilo"
      - name: E2E test and its negative (pf rules for a dedicated user)
        if: matrix.kind == 'macos'
        run: |
          codesign --verify --verbose "$RUNNER_TEMP/ext/extension/bin/kilo"
          bash packages/albert/e2e/macos.sh "$RUNNER_TEMP/ext/extension/bin/kilo"
          bash packages/albert/e2e/macos.sh --leak "$RUNNER_TEMP/ext/extension/bin/kilo"
      - name: E2E test (connections audited by the Windows Filtering Platform)
        if: matrix.kind == 'windows'
        run: ./packages/albert/e2e/windows.ps1 -Bin "$env:RUNNER_TEMP\ext\extension\bin\kilo.exe"
      - name: Negative test (a deliberate leak must be detected)
        if: matrix.kind == 'windows'
        run: ./packages/albert/e2e/windows.ps1 -Bin "$env:RUNNER_TEMP\ext\extension\bin\kilo.exe" -Leak

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, e2e, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tag
        run: |
          version=$(jq -r .version packages/kilo-vscode/package.json)
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag $GITHUB_REF_NAME is not on main"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Release notes (CHANGELOG entry of this version)
        run: |
          awk -v head="## $VERSION" '$0 == head { on = 1; next } /^## / { if (on) exit } on' packages/kilo-vscode/CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q . "$RUNNER_TEMP/notes.md" || { echo "no CHANGELOG entry for $VERSION"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          pattern: albert-code-*-vsix
          merge-multiple: true
          path: ${{ runner.temp }}/vsix
      - name: Create the GitHub Release
        working-directory: ${{ runner.temp }}/vsix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=()
          for target in linux-x64 linux-arm64 alpine-x64 alpine-arm64 darwin-x64 darwin-arm64 win32-x64 win32-arm64; do
            file="albert-code-$VERSION-$target.vsix"
            mv "albert-code-$target.vsix" "$file"
            sha256sum "$file" > "$file.sha256"
            files+=("$file" "$file.sha256")
          done
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "Albert Code $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
